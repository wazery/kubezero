---
apiVersion: aws.platform.upbound.io/v1alpha1
kind: XEKS
metadata:
  name: aws-eks
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  parameters:
    id: aws-eks
    providerConfigName: management-provider-aws
    # To set a custom region, specify availability zones in the XNetwork
    # for all subnets. If not set, the default region and zones are used.
    region: eu-west-1
    version: "1.33"
    accessConfig:
      authenticationMode: API_AND_CONFIG_MAP
      bootstrapClusterCreatorAdminPermissions: true
    nodes:
      count: 1
      instanceType: t3.small
  writeConnectionSecretToRef:
    name: aws-eks-kubeconfig
    namespace: crossplane-system
  publishConnectionDetailsTo:
    name: my-cluster-connection
    configRef:
      name: argocd-cluster-template
    metadata:
      labels:
        argocd.argoproj.io/secret-type: cluster
      annotations:
        example.com/managed-by: crossplane
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cluster-template
data:
  template: |
    name: {{ .name }}
    server: {{ .server }}
    config: |
      {
        "awsAuthConfig": {
          "clusterName": "{{ .clusterName }}"
        },
        "tlsClientConfig": {
          "insecure": false,
          "caData": "{{ .certificate }}"
        }
      } 
